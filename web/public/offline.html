<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FIP — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #09090b;
        color: #fafafa;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .wrap {
        max-width: 320px;
      }
      .mark {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: 3rem;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        background: #e11d48;
        margin-left: 2px;
        vertical-align: super;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 1.5rem 0 0.5rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      button {
        appearance: none;
        border: 0;
        background: #e11d48;
        color: white;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        border-radius: 0.6rem;
        cursor: pointer;
      }
      button:hover {
        background: #f43f5e;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">FIP<span class="dot"></span></div>
      <h1>You're offline</h1>
      <p>FIP needs a connection to load fresh looks and your profile. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
